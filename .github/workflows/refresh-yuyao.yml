name: Refresh Yuyao playlist (VOD)

# 余姚是节目点播：mp4 无签名、不过期，仅在有新节目时变化
# （Pi 的 */15 cron 也会刷新，这里作为兜底）
# 该栏目每天更新数次，故每 2 小时刷一次即可（避免无谓提交）
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh yuyao.m3u
        run: python3 scripts/yuyao_vod.py -o yuyao.m3u
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yuyao.m3u
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "chore: refresh yuyao.m3u (VOD list)"
            git push
          fi
