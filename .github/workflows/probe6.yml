name: probe-pi-ipv6

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: curl Pi over IPv6
        run: |
          echo "=== / ==="
          curl -6 -s -m 20 -o /dev/null -w "http=%{http_code}\n" "http://[2409:8a1e:4d26:3490:759b:45f0:e28e:48f7]/" || echo "fail"
          echo "=== ningbo.m3u ==="
          curl -6 -s -m 20 -o /dev/null -w "http=%{http_code}\n" "http://[2409:8a1e:4d26:3490:759b:45f0:e28e:48f7]/iptv/ningbo.m3u" || echo "fail"
