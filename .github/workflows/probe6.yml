name: probe-pi-ports

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe6.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe orange pi ipv6 ports
        run: |
          PI="2409:8a1e:4d26:3490:759b:45f0:e28e:48f7"
          echo "runner has ipv6: $(curl -6 -s -m 10 https://v6.ident.me || echo NO)"
          for p in 80 443 22 8443 4173 18789; do
            printf "port %-6s " "$p"
            timeout 12 bash -c "echo > /dev/tcp/[$PI]/$p" 2>/dev/null && echo OPEN || echo closed/filtered
          done
          echo "--- http check ---"
          curl -6 -s -m 15 -o /dev/null -w "http://[PI]:80/ => %{http_code}\n" "http://[$PI]/" || echo "  http fail"
          curl -6 -s -m 15 -o /dev/null -w "http://[PI]:80/iptv/ningbo.m3u => %{http_code}\n" "http://[$PI]/iptv/ningbo.m3u" || echo "  m3u fail"
