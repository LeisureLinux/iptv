name: Refresh Ningbo playlist (live) [backup]

# ⚠️ 主刷新在 Orange Pi 的 cron（*/15，见 ~/iptv-refresh/refresh.sh）。
# GitHub Actions 的 schedule 在本仓库实测长时间不触发（schedule 事件数为 0），
# 因此这里降级为「每 6 小时兜底」+ 手动触发，避免与 Pi 抢 commit 造成冲突。
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh ningbo.m3u
        run: python3 scripts/ningbo_live.py --probe -o ningbo.m3u
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ningbo.m3u
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "chore: refresh ningbo.m3u (backup)"
            git push || echo "push 冲突，交给 Pi cron 处理"
          fi
